name: Build Fluxer package (nightly)

# Builds a Windows installer plus a portable zip on every push to main and
# publishes them to a rolling "nightly" pre-release. Uses npm and the
# license-free background images committed in the repo, so it needs no private
# asset repo and no signing secrets. The build is unsigned.

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Avoid piling up builds if several commits land quickly.
concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Windows package
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Make package
        run: npm run make

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kenku-fm-windows-x64
          path: out/make/**/*
          if-no-files-found: error

      - name: Publish rolling "nightly" pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Mark the zip maker's output as the portable build in the asset list.
          for z in out/make/zip/win32/x64/*.zip; do
            mv "$z" "${z%.zip}-portable.zip"
          done
          # Replace the previous nightly so there is always a single, current build.
          gh release delete nightly --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          # Glob expansion keeps each filename a separate arg, so spaces in names
          # (e.g. "Kenku FM-1.5.5 Setup.exe") are handled correctly. Ship only the
          # Setup.exe from the squirrel maker; the .nupkg and RELEASES files exist
          # solely for Squirrel auto-updates, which this app does not use.
          gh release create nightly out/make/squirrel.windows/*/*Setup.exe out/make/zip/win32/x64/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Nightly build (${GITHUB_SHA:0:7})" \
            --notes "Automated unsigned Windows build from commit ${GITHUB_SHA}. The Setup.exe installs the app; the -portable.zip runs in place with no install (extract and run kenku-fm.exe). Windows may warn about an unrecognized publisher; DRM/Widevine playback is unavailable in unsigned builds."
